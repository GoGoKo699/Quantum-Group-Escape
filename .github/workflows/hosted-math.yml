name: Exact Group Escape final hosted review
on:
  pull_request:
    paths:
      - .github/workflows/hosted-math.yml
permissions:
  contents: read
jobs:
  resume:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'check/exact-escape-hosted-resume' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCIENCE_REVISION: a1020ec8afed8eda52f762115446607a2a8a0998
      SCIENCE_TREE: 6c18114b0b3bb1bee1509d3849130b228fb88c22
    steps:
      - name: Check out the unchanged scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SCIENCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install the matching capture runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          capture_cli="$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js"
          node "$capture_cli" install chromium
          if ! NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules" node -e 'require("playwright").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error.message); process.exitCode = 1; })'; then
            node "$capture_cli" install-deps chromium
          fi
      - name: Capture both widths and retry only transient GitHub responses
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          test "$(git rev-parse HEAD)" = "$SCIENCE_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SCIENCE_TREE"
          resume=()
          mkdir -p "$RUNNER_TEMP/group-resume"
          for attempt in 1 2 3 4 5; do
            output="$RUNNER_TEMP/group-resume/attempt-$attempt"
            if node verification/hosted_math/capture_hosted_math.cjs \
              --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
              --revision "$SCIENCE_REVISION" --contract verification/hosted_math/math-contract.json \
              "${resume[@]}" --output "$output"; then
              jq '{status,revision,tree,viewports:[.viewports[]|{width,status,structural_matches}]}' "$output/hosted-report.json"
              exit 0
            fi
            test -f "$output/capture-state.json"
            jq -e '.failures | length > 0 and all(.category == "transport_failure")' "$output/capture-state.json" >/dev/null
            resume=(--resume-from "$output")
          done
          exit 1
      - name: Retain captured pages and comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-escape-exact-source-final
          path: ${{ runner.temp }}/group-resume
          if-no-files-found: error
          retention-days: 14
