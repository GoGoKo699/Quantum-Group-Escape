name: Scientific and hosted verification

on:
  pull_request:
    paths:
      - '**.md'
      - 'llms.txt'
      - 'verification/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAPTURE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run finite scientific checks
        run: |
          python -m pip install -r verification/requirements.txt
          python verification/check_finite_groups.py > "$RUNNER_TEMP/science-results.json"
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test representative hosted mathematics
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/probe_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" \
            --page README.md \
            --output "$RUNNER_TEMP/hosted-probe"
      - name: Compare every hosted mathematical expression
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" \
            --contract verification/hosted_math/math-contract.json \
            --output "$RUNNER_TEMP/hosted-math"
      - name: Retain captures and comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}
          path: |
            ${{ runner.temp }}/hosted-probe
            ${{ runner.temp }}/hosted-math
            ${{ runner.temp }}/science-results.json
          if-no-files-found: error
          retention-days: 14
